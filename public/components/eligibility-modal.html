<!-- Free Eligibility Check Modal Start -->
<div class="modal fade" id="searchModal" tabindex="-1"
     aria-labelledby="eligibilityModalLabel" aria-hidden="true">

    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content rounded-3 border-0 shadow bg-white">

            <div class="modal-header">
                <h4 class="modal-title text-secondary mb-0"
                    id="eligibilityModalLabel">
                    Free Eligibility Check
                </h4>
                <button type="button" class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Close"></button>
            </div>

            <div class="modal-body p-4 p-md-5">

                <p class="text-muted mb-4">
                    Planning to study abroad? Share a few details
                    and our consultants will help you explore your options.
                </p>

                <form id="eligibilityForm">

                    
                    <div class="mb-4">
                        <label for="eligibilityCountry"
                               class="form-label fw-semibold">
                            Preferred Study Country
                        </label>

                        <select id="eligibilityCountry"
                                class="form-select p-3" required>
                            <option value="" selected disabled>
                                Select your preferred country
                            </option>
                            <option value="Cyprus">Cyprus</option>
                            <option value="Turkey">Turkey</option>
                            <option value="Other / Not Sure">
                                Other / Not Sure
                            </option>
                        </select>
                    </div>

                    
                    <div class="mb-4">
                        <label for="eligibilityQualification"
                               class="form-label fw-semibold">
                            Last Qualification
                        </label>

                        <select id="eligibilityQualification"
                                class="form-select p-3" required>
                            <option value="" selected disabled>
                                Select your qualification
                            </option>
                            <option value="Matric">Matric</option>
                            <option value="Intermediate">Intermediate</option>
                            <option value="Diploma">Diploma</option>
                            <option value="Bachelor's Degree">
                                Bachelor's Degree
                            </option>
                            <option value="Master's Degree">
                                Master's Degree
                            </option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    
                    <div class="mb-4">
                        <label for="eligibilityBudget"
                               class="form-label fw-semibold">
                            Estimated Study Budget (PKR)
                        </label>

                        <select id="eligibilityBudget"
                                class="form-select p-3" required>
                            <option value="" selected disabled>
                                Select your estimated budget
                            </option>
                            <option value="Below PKR 5 Lakh">
                                Below PKR 5 Lakh
                            </option>
                            <option value="PKR 5–10 Lakh">
                                PKR 5–10 Lakh
                            </option>
                            <option value="PKR 10–20 Lakh">
                                PKR 10–20 Lakh
                            </option>
                            <option value="Above PKR 20 Lakh">
                                Above PKR 20 Lakh
                            </option>
                            <option value="Not Sure Yet">
                                Not Sure Yet
                            </option>
                        </select>
                    </div>

                    <button type="submit"
                            class="btn btn-primary w-100 py-3 rounded-pill">
                        <i class="fab fa-whatsapp me-2"></i>
                        Check Eligibility via WhatsApp
                    </button>

                </form>

                <p class="text-center text-muted small mt-3 mb-0">
                    Free enquiry — no obligation to apply.
                </p>

            </div>
        </div>
    </div>
</div>
<!-- Free Eligibility Check Modal End -->
